<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atom a jádro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#edf0f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0f1c">
<style>
/* Layout: mobile app shell with bottom tabs; rail on desktop. Atom-lab palette: ink navy + electron cyan, photon amber. */
:root{
  --bg:#edf0f5; --surface:#ffffff; --surface-2:#e3e8f1; --fg:#111a2c; --fg-2:#56627c; --line:rgba(17,26,44,.11);
  --accent:#0a7aa3; --on-accent:#ffffff; --accent-soft:rgba(10,122,163,.12);
  --proton:#e0463b; --neutron:#6b7ca6; --electron:#0a8fc0; --photon:#d98500;
  --ok:#16915f; --ok-soft:rgba(22,145,95,.13); --bad:#d3413a; --bad-soft:rgba(211,65,58,.12);
  --shadow:0 1px 2px rgba(17,26,44,.06),0 10px 28px -14px rgba(17,26,44,.22);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
  --f-display:'Archivo',system-ui,-apple-system,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f1c; --surface:#121a2e; --surface-2:#1b2641; --fg:#e8ecf6; --fg-2:#93a0bd; --line:rgba(232,236,246,.10);
  --accent:#4cc9f0; --on-accent:#06202b; --accent-soft:rgba(76,201,240,.14);
  --proton:#ff6b5e; --neutron:#8a9bc4; --electron:#4cc9f0; --photon:#ffb547;
  --ok:#3ddc97; --ok-soft:rgba(61,220,151,.14); --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1c; --surface:#121a2e; --surface-2:#1b2641; --fg:#e8ecf6; --fg-2:#93a0bd; --line:rgba(232,236,246,.10);
  --accent:#4cc9f0; --on-accent:#06202b; --accent-soft:rgba(76,201,240,.14);
  --proton:#ff6b5e; --neutron:#8a9bc4; --electron:#4cc9f0; --photon:#ffb547;
  --ok:#3ddc97; --ok-soft:rgba(61,220,151,.14); --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:0;margin:0}
button,[role=button],a,summary{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
sup,sub{line-height:0;font-size:.7em}
.nuc{display:inline-flex;align-items:center;white-space:nowrap}
.nuc i{display:inline-flex;flex-direction:column;align-items:flex-end;font-style:normal;font-size:.62em;line-height:1.05;margin-right:.12em;font-family:var(--f-mono)}
.nuc i b{font-weight:500}

/* shell */
.app{min-height:100dvh;padding-bottom:calc(var(--nav-h) + 24px)}
.main{max-width:1040px;margin:0 auto;padding:16px 16px 8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;font-size:1.05rem}
.brand svg{width:26px;height:26px;color:var(--accent)}
.chip-info{font-size:.78rem;color:var(--fg-2);font-family:var(--f-mono)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;justify-content:space-around;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 78%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.68rem;font-weight:500;color:var(--fg-2);transition:color 160ms var(--ease-out),transform 120ms var(--ease-out);min-width:0}
.nav button svg{width:22px;height:22px}
.nav button:active{transform:scale(.94)}
.nav button[aria-selected=true]{color:var(--accent)}
@media (prefers-reduced-transparency:reduce){.nav{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (min-width:900px){
  .nav{top:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:4px;padding:84px 12px 12px;border-top:0;border-right:1px solid var(--line)}
  .nav button{flex:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:.92rem;justify-content:flex-start}
  .app{padding:0 0 24px 210px}
  .main{padding:28px 32px}
  .topbar{padding-top:0}
}
@media (hover:hover) and (pointer:fine){.nav button:hover{color:var(--fg)}.nav button[aria-selected=true]:hover{color:var(--accent)}}

.view{display:none}
.view.on{display:block;animation:viewIn 260ms var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
.rise>*{animation:viewIn 380ms var(--ease-out) both}
.rise>*:nth-child(2){animation-delay:40ms}.rise>*:nth-child(3){animation-delay:80ms}.rise>*:nth-child(4){animation-delay:120ms}.rise>*:nth-child(5){animation-delay:160ms}.rise>*:nth-child(6){animation-delay:200ms}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid>*,.lab>*,.row>*{min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);font-weight:600}
.h-sec{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--fg-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--surface-2);transition:transform 120ms var(--ease-out),background 160ms,opacity 160ms;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.88rem;border-radius:10px}
@media (hover:hover) and (pointer:fine){.btn:hover{background:color-mix(in srgb,var(--surface-2) 80%,var(--fg) 8%)}.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;font-weight:500;white-space:nowrap;transition:background 160ms,color 160ms,transform 120ms var(--ease-out)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left;transition:transform 700ms var(--ease-out)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:8px 14px;border-radius:10px;font-weight:600;font-size:.88rem;color:var(--fg-2);white-space:nowrap;transition:background 160ms,color 160ms}
.seg button[aria-selected=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* home */
.hero{padding:22px 20px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);position:relative;overflow:hidden}
.hero h1{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero p{margin-top:8px;max-width:46ch;color:var(--fg-2)}
.hero canvas{position:absolute;right:-30px;top:50%;transform:translateY(-50%);width:200px;height:200px;opacity:.9;pointer-events:none}
@media (max-width:520px){.hero canvas{width:150px;height:150px;right:-34px;opacity:.55}}
.kpis{grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--fg-2);margin-top:2px}
.two{grid-template-columns:1fr}
@media (min-width:860px){.two{grid-template-columns:1.15fr .85fr}}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;width:100%;text-align:left;padding:9px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .nm{font-weight:500}
.mrow .pc{font-family:var(--f-mono);font-size:.82rem;color:var(--fg-2)}
.mrow .bar{grid-column:1/-1}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.t{border-collapse:collapse;width:100%;min-width:520px;font-size:.88rem}
table.t th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border:0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;width:100%;text-align:left}
.chk+.chk{border-top:1px solid var(--line)}
.chk .bx{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--fg-2);display:grid;place-items:center;transition:background 160ms,border-color 160ms;margin-top:1px}
.chk .bx svg{width:14px;height:14px;color:var(--on-accent);stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset 260ms var(--ease-out)}
.chk[aria-checked=true] .bx{background:var(--accent);border-color:var(--accent)}
.chk[aria-checked=true] .bx svg{stroke-dashoffset:0}
.chk[aria-checked=true] .tx{color:var(--fg-2);text-decoration:line-through;text-decoration-color:var(--line)}

/* flashcards */
.deck{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.stage{perspective:1400px;position:relative;touch-action:pan-y;min-height:340px}
.drag{position:absolute;inset:0;will-change:transform;cursor:grab;touch-action:pan-y}
.drag.back{transition:transform 320ms var(--ease-out),opacity 220ms}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 520ms var(--ease-out)}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;overflow:hidden}
.face.bk{transform:rotateY(180deg);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.face .topic{margin-bottom:auto}
.face .q{font-family:var(--f-display);font-weight:700;font-size:clamp(1.25rem,4.6vw,1.7rem);letter-spacing:-.015em;line-height:1.2;margin:auto 0;text-wrap:balance}
.face .hint{font-size:.78rem;color:var(--fg-2);margin-top:auto}
.face .ans{overflow:auto;margin:auto 0;font-size:1.02rem;line-height:1.55;max-height:100%}
.stamp{position:absolute;top:18px;padding:5px 12px;border-radius:10px;font-weight:800;font-family:var(--f-display);letter-spacing:.04em;opacity:0;pointer-events:none;border:2px solid;font-size:.95rem;z-index:3}
.stamp.l{left:16px;color:var(--bad);transform:rotate(-8deg)}.stamp.r{right:16px;color:var(--ok);transform:rotate(8deg)}
.deckbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dots{display:flex;justify-content:space-between;font-size:.82rem;color:var(--fg-2);font-family:var(--f-mono)}

/* quiz & test */
.tiles{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{text-align:left;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:transform 140ms var(--ease-out)}
.tile:active{transform:scale(.98)}
.tile .nm{font-weight:600;font-family:var(--f-display);font-size:1.02rem;letter-spacing:-.01em}
.qcard .qt{font-family:var(--f-display);font-weight:700;font-size:clamp(1.15rem,4vw,1.45rem);line-height:1.28;letter-spacing:-.01em;margin:10px 0 16px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:1rem;min-height:52px;transition:transform 120ms var(--ease-out),background 180ms,border-color 180ms}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;font-weight:500}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.right .k{background:var(--ok);color:#fff}.opt.wrong .k{background:var(--bad);color:#fff}
.opt.shake{animation:shake 320ms var(--ease-out)}
@keyframes shake{20%{transform:translateX(-5px)}50%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.expl{margin-top:14px;padding:13px 14px;border-radius:14px;background:var(--surface-2);font-size:.94rem;animation:viewIn 260ms var(--ease-out) both}
.expl b.g{color:var(--ok)}.expl b.r{color:var(--bad)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--surface-2);transition:background 200ms}
.prog i.d{background:var(--accent)}.prog i.ok{background:var(--ok)}.prog i.no{background:var(--bad)}.prog i.cur{background:var(--fg-2)}
.score{font-family:var(--f-display);font-weight:800;font-size:3.4rem;letter-spacing:-.04em;line-height:1}
.nav-q{display:flex;gap:6px;flex-wrap:wrap}
.nav-q button{width:34px;height:34px;border-radius:10px;background:var(--surface-2);font-family:var(--f-mono);font-size:.8rem}
.nav-q button.a{background:var(--accent-soft);color:var(--accent)}
.nav-q button.c{outline:2px solid var(--accent)}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;padding:6px 12px;border-radius:10px;background:var(--surface-2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.rev{padding:14px 0;border-top:1px solid var(--line)}
.rev .qt{font-weight:600;margin-bottom:8px}

/* models */
.lab{display:grid;gap:12px}
@media (min-width:860px){.lab.split{grid-template-columns:1.3fr 1fr}}
.cv{position:relative;border-radius:20px;background:radial-gradient(120% 100% at 50% 40%,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface));border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);touch-action:pan-y}
.cv canvas{display:block;width:100%;height:100%}
.cv.sq{aspect-ratio:1/1;max-height:520px}
.cv.wd{aspect-ratio:4/3}
.cv .tag{position:absolute;left:12px;top:10px;font-family:var(--f-mono);font-size:.74rem;color:var(--fg-2);pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--fg-2)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
input:not([type=range]),select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
.big-el{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big-el .sym{font-family:var(--f-display);font-weight:800;font-size:3rem;letter-spacing:-.04em;line-height:1}
.cfg{font-family:var(--f-mono);font-size:.95rem;line-height:1.7;word-break:break-word}
.boxes{display:flex;flex-wrap:wrap;gap:8px 12px}
.sub{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.sub .nm{font-family:var(--f-mono);font-size:.7rem;color:var(--fg-2)}
.sub .bs{display:flex}
.bxo{width:26px;height:26px;border:1.5px solid var(--fg-2);margin-right:-1.5px;display:grid;place-items:center;font-size:.9rem;line-height:1;font-family:var(--f-mono);color:var(--accent)}
.bxo.v{border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--fg-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.eq{font-size:1.15rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:44px}
.eq .arrow{color:var(--fg-2)}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{padding:4px 9px;border-radius:9px;background:var(--surface-2);font-size:.85rem}
.dec-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.dec-btns{grid-template-columns:repeat(4,1fr)}}
.empty{padding:28px 12px;text-align:center;color:var(--fg-2)}
.foot{margin-top:28px;font-size:.78rem;color:var(--fg-2);text-align:center}
@media (prefers-reduced-motion:reduce){
  .view.on,.rise>*,.expl{animation:none}
  .flip{transition:opacity 200ms}
  .opt.shake{animation:none}
  .bar>i{transition:none}
}
</style>

<div class="app">
  <nav class="nav" role="tablist" aria-label="Sekce">
    <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5" rx="2"/><rect x="13.5" y="11" width="7.5" height="10" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/></svg>Přehled</button>
    <button role="tab" data-tab="cards" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>Kartičky</button>

const CARDS_RAW=[
['stavba','Z čeho se skládá atom?','Z <b>jádra</b> a <b>elektronového obalu</b>.\nV jádře jsou protony p^+ a neutrony n^0 (společně <b>nukleony</b>), v obalu elektrony e^−.'],
['stavba','Jaký náboj mají jádro, obal a celý atom?','Jádro je kladné, obal záporný, atom navenek <b>neutrální</b>.\nPočet protonů = počet elektronů.'],
['stavba','Kde je v atomu soustředěna hmotnost?','V jádře, asi <b>99,9 %</b>.\nElektrony dohromady dávají jen asi 0,05 %.\nm(p) = m(n) ≈ 1,67·10^{−27} kg, m(e^−) ≈ 9,1·10^{−31} kg (elektron je asi 1840× lehčí než proton).'],
['stavba','Jak velké jsou jádro a atom (řádově)?','Jádro: poloměr řádově <b>10^{−15} m</b> (10^{−15} až 10^{−14} m).\nAtom: poloměr řádově <b>10^{−10} m</b>.'],
['stavba','Co je valenční vrstva?','Nejvyšší sféra obsazená elektrony. Její elektrony rozhodují o reaktivitě atomu. Ostatní obsazené vrstvy jsou vnitřní.'],
['stavba','Sféry elektronového obalu a jejich kapacita','Sféry K, L, M, N, O, P, Q (n = 1 až 7).\nKapacita <b>2n^2</b>: K max 2 e^−, L max 8 e^−, M 18, N 32.'],
['modely','Vývoj atomových teorií: pořadí','Demokritos a Leukippos (nedělitelné „atomy“) → Dalton → Thomson (pudinkový model, elektron 1897) → Rutherford (1911, jádro) → Bohr (1913) → kvantově-mechanický model (Schrödinger, Heisenberg).'],
['modely','Thomsonův model','„Pudinkový“ model: kladná koule s rozptýlenými elektrony. Thomson objevil elektron (1897).'],
['modely','Rutherfordův model (1911)','Malé, těžké, kladně nabité jádro; elektrony kolem něj obíhají jako planety. Téměř všechna hmotnost je v jádře.'],
['modely','Bohrův model (1913)','Elektrony obíhají po <b>kruhových drahách</b> s určitou energií (hladiny K, L, M…).\nEnergie roste se vzdáleností od jádra.\nPřeskok na vyšší hladinu = pohlcení energie, na nižší = vyzáření fotonu (emise).'],
['modely','Kvantově-mechanický model','Elektron má vlastnosti částice i vlnění. Nepohybuje se po drahách, ale je v <b>orbitalu</b>.\nHeisenbergův princip neurčitosti: nelze přesně určit, kde elektron je.'],
['modely','Co je orbital?','Část prostoru kolem jádra, kde se elektron vyskytuje s <b>95% pravděpodobností</b>.\nTypy orbitalů: s, p, d, f, každý má jinou energii.'],
['kvantova','Hlavní kvantové číslo n','Značí <b>energii</b> elektronu, vzdálenost od jádra a velikost orbitalu.\nHodnoty n = 1, 2, 3 … 7 (K, L, M …).\nMax. počet elektronů ve sféře: 2n^2.'],
['kvantova','Vedlejší kvantové číslo l','Určuje <b>tvar</b> orbitalu.\nHodnoty od 0 do n − 1.\nl = 0 → s, l = 1 → p, l = 2 → d, l = 3 → f.'],
['kvantova','Magnetické kvantové číslo m (m_{l})','Určuje <b>orientaci</b> orbitalu v prostoru.\nHodnoty od −l přes 0 do +l, tedy 2l + 1 hodnot.\nl = 1 → m = −1, 0, +1.'],
['kvantova','Spinové kvantové číslo m_{s}','Zjednodušeně rotace elektronu kolem vlastní osy.\nDvě hodnoty: <b>+½</b> a <b>−½</b>.'],
['kvantova','Co jsou degenerované orbitaly?','Orbitaly se stejným n i l (stejná energie), které se liší jen orientací, tedy číslem m.\nPř. tři orbitaly 2p.'],
['kvantova','Orbital s: tvar a počet','l = 0, tvar <b>koule</b>, v každé hladině jen <b>1</b> orbital s (m = 0).\nS rostoucím n se zvětšuje poloměr.'],
['kvantova','Orbital p: tvar a počet','l = 1, tvar <b>prostorové osmičky</b>, <b>3</b> orbitaly (m = −1, 0, 1), degenerované.\nMax. 6 elektronů.'],
['kvantova','Orbital d: tvar a počet','l = 2, <b>5</b> orbitalů (m = −2 až +2).\n4× tvar čtyřlístku, 1× osmička s prstencem.\nMax. 10 elektronů.'],
['kvantova','Orbital f: počet','l = 3, <b>7</b> orbitalů (m = −3 až +3). Tvary znát nemusíš.\nMax. 14 elektronů.'],
['kvantova','Kolik orbitalů a elektronů má sféra s číslem n?','Orbitalů <b>n^2</b>, elektronů <b>2n^2</b>.\nn = 3: 9 orbitalů, 18 elektronů.'],
['konfig','Pauliho princip výlučnosti','V atomu nemohou být dva elektrony se všemi čtyřmi kvantovými čísly stejnými.\nV jednom orbitalu jsou nejvýš <b>2 elektrony s opačným spinem</b> (↑↓).'],
['konfig','Hundovo pravidlo maximální multiplicity','V degenerovaných orbitalech se nejdřív obsadí každý orbital <b>jedním elektronem</b> (se stejným spinem), páry vznikají až potom.\nPř. dusík 2p^3: ↑ ↑ ↑.'],
['konfig','Výstavbový princip a pořadí orbitalů','Nejdřív se zaplňují orbitaly s nižší energií.\n<b>1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p</b>'],
['konfig','Madelungovo pravidlo (n + l)','Vyšší energii má orbital s vyšším součtem n + l.\n5s: 5 + 0 = 5, 4d: 4 + 2 = 6.\nPři shodě součtu se dřív plní orbital s <b>nižším n</b>.'],
['konfig','Proč se 4s plní před 3d?','4s: n + l = 4, 3d: n + l = 5, takže 4s má nižší energii a plní se první.\nKdyž už je v d aspoň jeden elektron, 3d energeticky klesne pod 4s.'],
['konfig','Tři způsoby zápisu elektronové konfigurace','<b>Úplná</b>: 1s^2 2s^2 2p^6 3s^1\n<b>Zkrácená</b> (vzácným plynem): [Ne] 3s^1\n<b>Rámečková</b>: orbitaly jako rámečky, elektrony jako šipky ↑↓'],
['konfig','Zapiš konfiguraci Fe (Z = 26)','1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^6\nZkráceně: [Ar] 3d^6 4s^2'],
['konfig','Výjimky: Cr a Cu','Cr: [Ar] 3d^5 4s^1 (napůl zaplněné d)\nCu: [Ar] 3d^{10} 4s^1 (plně zaplněné d)\nStejně Mo, Ag, Au. Napůl (d^5) nebo plně (d^{10}) obsazené d mají zvýšenou stabilitu.'],
['konfig','Jak vzniká kationt a jak se píše jeho konfigurace?','Odtržením elektronů (dodáním energie, ionizační energie).\nNejdřív se odebírají elektrony z <b>nejvyšší hladiny</b> (ns), pak teprve z d.\nFe^{3+}: [Ar] 3d^5  (4s vyprázdníme první)'],
['konfig','Jak vzniká anion?','Přijetím elektronů (uvolní se energie, elektronová afinita).\nS^{2−}: 1s^2 2s^2 2p^6 3s^2 3p^6, stejně jako Ar.'],
['konfig','Izoelektronové částice','Mají stejný počet elektronů i konfiguraci.\nNe, Na^+, F^− mají všechny 10 elektronů: 1s^2 2s^2 2p^6.'],
['konfig','Základní a excitovaný stav','Základní stav: minimální energie.\nExcitovaný: atom pohltí energii a elektron přeskočí do energeticky vyššího orbitalu <b>ve stejné hladině</b>, a to z nejbližšího orbitalu.\nC: 2s^2 2p^2 → 2s^1 2p^3.'],
['konfig','Vzácné plyny: konfigurace','Valenční vrstva ns^2 np^6 (oktet, u He 1s^2). Stabilní a málo reaktivní.\nOstatní atomy se při reakcích snaží získat konfiguraci vzácného plynu.'],
['konfig','s-, p-, d- a f-prvky','<b>s a p</b>: nepřechodné, valenční elektrony v ns a np.\n<b>d</b>: přechodné, plní (n−1)d: ns^{1–2} (n−1)d^{1–10}.\n<b>f</b>: lanthanoidy a aktinoidy (vnitřně přechodné), plní (n−2)f.'],
['konfig','Které orbitaly mají jaké n v periodě?','Orbitaly s a p mají n rovné číslu periody, orbitaly d mají n − 1, orbitaly f mají n − 2.'],
['konfig','Ionizační energie a elektronová afinita','<b>Ionizační energie</b>: energie na odtržení valenčního elektronu (kJ·mol^{−1}). Čím vyšší, tím méně ochotně prvek elektron odevzdá.\n<b>Elektronová afinita</b>: energie uvolněná při přijetí elektronu. Čím vyšší, tím je prvek elektronegativnější.'],
['nuklidy','Co je protonové číslo Z?','Počet protonů v jádře. Zapisuje se vlevo dole: {1|1|H}, {32|16|S}.\nUrčuje prvek a (u neutrálního atomu) i počet elektronů.'],
['nuklidy','Nukleonové číslo A a neutronové číslo N','<b>A = Z + N</b> (součet protonů a neutronů). Píše se vlevo nahoře: {32|16|S}.\nN = A − Z, u značky se neuvádí.'],
['nuklidy','Nuklid','Množina atomů se stejným <b>protonovým i nukleonovým</b> číslem.\nPř. všechny atomy {15|7|N}. Nuklid je určen dvojicí Z a A.'],
['nuklidy','Prvek','Množina atomů se stejným <b>protonovým číslem</b> (mohou mít různé A).'],
['nuklidy','Izotopy','Atomy téhož prvku se stejným Z, ale různým N (a tedy A).\nVodík: protium {1|1|H}, deuterium {2|1|H}, tritium {3|1|H}.\nPrvky jsou mono- nebo polyizotopické.'],
['nuklidy','Izobary','Nuklidy se stejným <b>nukleonovým</b> číslem A, ale různým Z.\nPř. {45|21|Sc} a {45|22|Ti}.'],
['nuklidy','Izotony','Nuklidy se stejným <b>neutronovým</b> číslem N.'],
['nuklidy','Kolik p, n a e má {75|33|As}?','Protonů 33, neutronů 75 − 33 = <b>42</b>, elektronů 33 (neutrální atom).'],
['nuklidy','Kolik p, n a e má částice {35|17|X}^{2+}?','Protonů 17, neutronů 18, elektronů 17 − 2 = <b>15</b> (kationt 2+ elektrony ztratil).'],
['zareni','Co je radioaktivita?','Samovolná přeměna nestabilních jader na stabilnější, spojená s vyzařováním neviditelného záření. Trvá, dokud nevznikne stabilní nuklid.'],
['zareni','Přirozená vs. umělá radioaktivita','<b>Přirozená</b>: nestabilní jádra v přírodě se rozpadají samovolně (asi 50 radionuklidů, hlavně těžké prvky 82 < Z < 92).\n<b>Umělá</b>: i stabilní jádra se stanou radioaktivními po ozáření částicemi, např. v reaktoru.'],
['zareni','Řeka stability','O stabilitě nuklidu rozhoduje <b>poměr počtu neutronů N a protonů Z</b>. Nuklidy mimo „řeku“ jsou radioaktivní.'],
['zareni','Kdo objevil radioaktivitu?','Becquerel 1896 (sloučeniny uranu).\nNázev radioaktivita: manželé Curieovi 1898 (radium a polonium).'],
['zareni','Záření α','Jádra helia {4|2|He} (2 p + 2 n), kladné.\nA klesne o 4, Z o 2, nuklid se posune o <b>2 místa vlevo</b> v PSP.\nZastaví ho list papíru, ale uvnitř těla je nebezpečné. Největší ionizační schopnost.'],
['zareni','Záření β^−','Proud elektronů. Neutron → proton + elektron.\nZ se zvýší o 1, A se nemění, posun o <b>1 místo vpravo</b>.\nZastaví ho vrstva vody 1–2 cm nebo hliníkový plech.'],
['zareni','Záření β^+','Proud pozitronů. Proton → neutron + pozitron {0|+1|e}.\nZ klesne o 1, A se nemění, posun o <b>1 místo vlevo</b>.\nPozitron zanikne s elektronem za vzniku fotonů.'],
['zareni','Záření γ','Elektromagnetické (fotonové) záření s velmi krátkou vlnovou délkou a vysokou energií. Nemá náboj.\nProniká tělem, zastaví ho tlustá stěna z betonu nebo olova. Ionizuje nepřímo.'],
['zareni','Rentgenové záření (X)','Fotonové záření: brzdné (brzdění nabitých částic) a charakteristické (přechod elektronu obalu na nižší hladinu).'],
['zareni','Neutrony: vlastnosti a stínění','Nenabité, proto přímo neionizují (ionizace přes vzniklé záření α nebo β).\nVelmi pronikavé. Nejlépe je stíní voda, parafín nebo beton, protože H jádra je zpomalují.'],
['premeny','Štěpná jaderná reakce','Štěpení těžkého jádra na dvě lehčí vyvolané <b>pomalými neutrony</b>.\nŘetězová reakce: aspoň 1 neutron z každého štěpení musí vyvolat další štěpení.'],
['premeny','Termonukleární fúze','Slučování lehkých jader na těžší za vysokých teplot, uvolní se energie.\nZdroj energie hvězd včetně Slunce.'],
['premeny','Umělá transmutace (Rutherford 1919)','Bombardování jádra částicemi.\n{14|7|N} + {4|2|He} → {17|8|O} + {1|1|H}'],
['premeny','Jak doplnit jadernou rovnici?','Součet A vlevo = součet A vpravo a součet Z vlevo = součet Z vpravo.\nZ chybějící dvojice A a Z poznáš nuklid podle Z.'],
['premeny','Zápis reakce (částice vlevo, vpravo)','{27|13|Al}(α, n){30|15|P} znamená: Al + α → P + n.\nPřed čárkou je dopadající částice, za čárkou vznikající.'],
['premeny','Rozpadová řada','Řada radioaktivních přeměn končící stabilním izotopem.\n3 přírodní řady (z {232|90|Th}, {238|92|U}, {235|92|U}) končí olovem.\nUmělá řada začíná {237|93|Np}.'],
['premeny','Rozpadová řada {238|92|U} → {206|82|Pb}','8 rozpadů α a 6 rozpadů β^−.\nA: 238 − 8·4 = 206. Z: 92 − 16 + 6 = 82.'],
['polocas','Poločas rozpadu T½','Doba, za kterou se rozpadne <b>polovina</b> přítomných jader.\nNezávisí na množství látky ani na teplotě či tlaku, je konstantní pro daný nuklid.'],
['polocas','Vzorec pro zbylá jádra','N = N_{0} · (½)^{t/T}\nPo 1 poločasu ½, po 2 ¼, po 3 ⅛ … po 10 poločasech zbude méně než tisícina.'],
['polocas','Poločasy rozpadu k zapamatování','{212|84|Po}: 3·10^{−7} s (nejkratší)\n{232|90|Th}: 13,9 mld. let\n{238|92|U}: 4,5 mld. let\n{235|92|U}: 710 mil. let\n{14|6|C}: 5730 let'],
['polocas','Radiouhlíková metoda','Živý organismus má stálý poměr izotopů uhlíku, 1 g uhlíku dává <b>16 rozpadů/min</b> ({14|6|C}).\nPo smrti ubývá {14|6|C}. Po 5730 letech (T½) je to 8 rozpadů/min. Z poklesu určíme stáří nálezu.']
];

const ELMASS=[1,4,7,9,11,12,14,16,19,20,23,24,27,28,31,32,35,40,39,40,45,48,51,52,55,56,59,58,63,64,69,74,75,80,79,84,85,88,89,90,93,98,98,102,103,106,107,114,115,120,121,130,127,132];
const SHELLN='KLMNOPQ';
const ORDER=['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
const CAP={s:2,p:6,d:10,f:14}, LNUM={s:0,p:1,d:2,f:3};
const EXC={24:{'4s':1,'3d':5},29:{'4s':1,'3d':10},41:{'5s':1,'4d':4},42:{'5s':1,'4d':5},44:{'5s':1,'4d':7},45:{'5s':1,'4d':8},46:{'5s':0,'4d':10},47:{'5s':1,'4d':10}};
const NOBLE=[[2,'He'],[10,'Ne'],[18,'Ar'],[36,'Kr'],[54,'Xe']];
/* electron configuration as {sub:'3d',n,l,c}; ne = number of electrons, z = atomic number (for exceptions of neutral atoms) */
function econf(ne,z){
  let left=ne;const cnt={};
  for(const s of ORDER){const c=Math.min(CAP[s[1]],left);cnt[s]=c;left-=c;if(left<=0)break}
  if(ne===z&&EXC[z])Object.assign(cnt,EXC[z]);
  return cnt;
}
const subList=cnt=>Object.keys(cnt).filter(k=>cnt[k]>0||false).map(k=>({sub:k,n:+k[0],l:k[1],c:cnt[k]}));
const byN=a=>a.slice().sort((x,y)=>x.n-y.n||LNUM[x.l]-LNUM[y.l]);
/* element + charge → electron counts per subshell (cations lose electrons from the highest n first, highest l first) */
function ionConf(z,q){
  const ne=z-q; if(ne<1)return {};
  let cnt=econf(z,z);
  if(q>0){
    for(let k=0;k<q;k++){
      const occ=subList(cnt);const nmax=Math.max(...occ.map(o=>o.n));
      const cand=occ.filter(o=>o.n===nmax).sort((a,b)=>LNUM[b.l]-LNUM[a.l])[0];
      cnt[cand.sub]--;
    }
  } else if(q<0){cnt=econf(ne,-1)}
  return cnt;
}
function fmtConf(list){return list.map(o=>`${o.sub}^${o.c}`).join(' ')}
function shortConf(cnt,ne,isIon){
  const ex=NOBLE.find(n=>n[0]===ne);if(ex&&isIon)return {txt:`[${ex[1]}]`,core:ex[1]};
  let core=null;for(const [z,s] of NOBLE)if(z<ne)core=[z,s];
  if(!core)return {txt:fmtConf(byN(subList(cnt))),core:null};
  const cc=econf(core[0],core[0]);const rest={};
  for(const k in cnt){const r=cnt[k]-(cc[k]||0);if(r>0)rest[k]=r}
  for(const k in cc){if((cnt[k]||0)<cc[k])return {txt:fmtConf(byN(subList(cnt))),core:null}}
  return {txt:`[${core[1]}] `+fmtConf(byN(subList(rest))),core:core[1]};
}
/* excitation inside the valence shell: promote one electron from the nearest paired orbital to the nearest empty orbital */
function exciteSteps(cnt,steps){
  cnt=Object.assign({},cnt);const occ=subList(cnt);if(!occ.length)return cnt;
  const n=Math.max(...occ.map(o=>o.n));
  const ls=['s','p','d'].filter(l=>LNUM[l]<=n-1);
  for(let s=0;s<steps;s++){
    let best=null;
    for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){
      const a=n+ls[i],b=n+ls[j],no_a=2*LNUM[ls[i]]+1,no_b=2*LNUM[ls[j]]+1;
      if((cnt[a]||0)>no_a&&(cnt[b]||0)<no_b){const d=j-i;if(!best||d<best.d||(d===best.d&&i>best.i))best={a,b,i,d}}
    }
    if(!best)return {cnt,done:s,max:true};
    cnt[best.a]--;cnt[best.b]=(cnt[best.b]||0)+1;
  }
  return {cnt,done:steps,max:false};
}
function canExcite(cnt,steps){const r=exciteSteps(cnt,steps+1);return !r.max}

/* ===== canvas + theme ===== */
let _cols=null;
function cols(){
  if(_cols)return _cols;const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
  return _cols={fg:g('--fg'),fg2:g('--fg-2'),line:g('--line'),accent:g('--accent'),proton:g('--proton'),neutron:g('--neutron'),electron:g('--electron'),photon:g('--photon'),surface:g('--surface'),bg:g('--bg'),ok:g('--ok')};
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{_cols=null});
new MutationObserver(()=>{_cols=null}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});
function fitCv(c){
  const dpr=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;
  if(!w||!h)return null;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return {x,w,h};
}
const TAU=Math.PI*2, easeOut=t=>1-Math.pow(1-t,4), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rgba(hex,a){ // hex or rgb() string → rgba with alpha
  if(hex[0]==='#'){let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
  return hex.replace(/rgba?\(([^)]+)\)/,(m,p)=>`rgba(${p.split(',').slice(0,3).join(',')},${a})`);
}

/* ===== registry + loop ===== */
const Models=(()=>{
  const P={};let active=null,heroCv=null,raf=0,last=0;
  const segs=[['shell','Obal'],['orb','Orbitaly'],['nuc','Jádro'],['half','Poločas']];
  let cur='shell',labActive=false,root=null;
  function loop(t){
    raf=0;const dt=Math.min(.05,(t-last)/1000||0);last=t;
    if(labActive&&P[cur]&&P[cur].draw)P[cur].draw(t/1000,dt);
    if(heroCv)drawHero(t/1000);
    if(labActive||heroCv)raf=requestAnimationFrame(loop);
  }
  function kick(){if(!raf)raf=requestAnimationFrame(loop)}
  function show(id){
    if(P[cur]&&P[cur].leave)P[cur].leave();
    cur=id;
    $$('#labSeg button',root).forEach(b=>b.setAttribute('aria-selected',b.dataset.p===id));
    for(const k in P){const el=$('#lab-'+k,root);if(el)el.hidden=k!==id}
    if(P[id].enter)P[id].enter();kick();
  }
  function init(r){
    root=r;
    root.innerHTML=`<div class="stack"><div class="seg" id="labSeg" role="tablist">${segs.map(s=>`<button role="tab" data-p="${s[0]}" aria-selected="${s[0]==='shell'}">${s[1]}</button>`).join('')}</div>${segs.map(s=>`<div id="lab-${s[0]}" ${s[0]==='shell'?'':'hidden'}></div>`).join('')}</div>`;
    for(const k in P)P[k].mount($('#lab-'+k,root));
    $$('#labSeg button',root).forEach(b=>b.onclick=()=>show(b.dataset.p));
  }
  function setActive(on){labActive=on;if(on){if(P[cur].enter)P[cur].enter();kick()}else if(P[cur]&&P[cur].leave)P[cur].leave()}
  function hero(cv){heroCv=cv;if(cv){if(reduced()){heroStatic=true}kick()}}
  let heroStatic=false;
  function drawHero(t){
    const f=fitCv(heroCv);if(!f)return;const {x,w,h}=f,c=cols();x.clearRect(0,0,w,h);
    const cx=w/2,cy=h/2,R=Math.min(w,h)*.46;
    x.lineWidth=1.2;
    for(let i=0;i<3;i++){
      const rot=i*Math.PI/3+ .0;x.save();x.translate(cx,cy);x.rotate(rot);
      x.strokeStyle=rgba(c.accent,.55);x.beginPath();x.ellipse(0,0,R,R*.36,0,0,TAU);x.stroke();
      const a=(reduced()?i*2:t*(.9+i*.25))+i*2.1;
      x.fillStyle=c.electron;x.beginPath();x.arc(Math.cos(a)*R,Math.sin(a)*R*.36,4.2,0,TAU);x.fill();
      x.restore();
    }
    const g=x.createRadialGradient(cx,cy,0,cx,cy,R*.22);g.addColorStop(0,c.proton);g.addColorStop(1,rgba(c.proton,0));
    x.fillStyle=g;x.beginPath();x.arc(cx,cy,R*.22,0,TAU);x.fill();
    x.fillStyle=c.proton;x.beginPath();x.arc(cx-3,cy-2,5,0,TAU);x.fill();x.fillStyle=c.neutron;x.beginPath();x.arc(cx+4,cy+2,5,0,TAU);x.fill();
    if(reduced()){heroCv=null}
  }
  return {reg:(k,p)=>{P[k]=p},init,setActive,hero,kick,P};
})();

/* ===== panel: Bohr model + electron configuration ===== */
Models.reg('shell',(()=>{
  let Z=11,q=0,exc=0,els=[],root,cv,J={ph:'idle',t0:0};
  const sgn=q=>q===0?'':(Math.abs(q)>1?Math.abs(q):'')+(q>0?'+':'−');
  const shells=()=>{const cnt=ionConf(Z,q),by={};subList(cnt).forEach(o=>by[o.n]=(by[o.n]||0)+o.c);return by};
  function rebuild(){
    const by=shells();els=[];J={ph:'idle',t0:0};
    for(const n in by){const k=+n,c=by[n],off=Math.random()*TAU;for(let i=0;i<c;i++)els.push({sh:k,ang:off+i*TAU/c,jump:false})}
    setBtns();
  }
  const maxSh=()=>Math.max(...Object.keys(shells()).map(Number));
  const omega=s=>reduced()?0:1.5/Math.pow(s,1.15);
  function ringR(k,ns,R){return R*(.2+.8*k/ns)}
  function info(){
    const ne=Z-q,A=ELMASS[Z-1],N=A-Z,by=shells(),ks=Object.keys(by).map(Number),vs=Math.max(...ks);
    $('#shInfo',root).innerHTML=`<div class="big-el"><span class="sym">${fm(ELSYM[Z-1]+(q?'^{'+sgn(q)+'}':''))}</span><div><div style="font-family:var(--f-display);font-weight:700;font-size:1.25rem">${ELNAME[Z-1]}${q?(q>0?' (kationt)':' (anion)'):''}</div><div class="muted mono" style="font-size:.82rem">Z = ${Z}, A ≈ ${A}</div></div></div>
     <div class="row"><span class="pill" style="background:color-mix(in srgb,var(--proton) 18%,transparent);color:var(--proton)">${Z} p^+</span><span class="pill" style="background:color-mix(in srgb,var(--neutron) 22%,transparent);color:var(--fg)">${N} n^0</span><span class="pill">${ne} e^−</span></div>
     <div class="muted" style="font-size:.9rem">${ks.map(k=>`<b>${SHELLN[k-1]}</b> ${by[k]}`).join(' · ')}</div>
     <div style="font-size:.92rem">Valenční vrstva: <b>${SHELLN[vs-1]}</b> (n = ${vs}), <b>${by[vs]}</b> e^−</div>
     <div class="legend"><span><i style="background:var(--proton)"></i>proton</span><span><i style="background:var(--neutron)"></i>neutron</span><span><i style="background:var(--electron)"></i>elektron</span></div>`
     .replace(/\^(\+|−|0)/g,'<sup>$1</sup>');
  }
  function cfg(){
    const base=ionConf(Z,q),ne=Z-q;
    const mx=exciteSteps(base,exc);const cnt=mx.cnt;
    const full=byN(subList(cnt)),sh=shortConf(cnt,ne,q!==0&&exc===0);
    const vn=Math.max(...subList(base).map(o=>o.n));
    const view=new Set(subList(cnt).map(o=>o.sub));
    ['s','p','d'].filter(l=>LNUM[l]<=vn-1).forEach(l=>view.add(vn+l));

  }
  function draw(t,dt){

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const L='ABCDE';
function mastery(t){const cs=CARDS.filter(c=>c.t===t),qs=QS.filter(q=>q.t===t);
  const k=cs.filter(c=>S.known[c.id]).length,r=qs.filter(q=>S.q[q.id]===1).length;
  return{k,kn:cs.length,r,rn:qs.length,p:(k+r)/((cs.length+qs.length)||1)}}
function grade(p){return p>=.9?1:p>=.75?2:p>=.6?3:p>=.45?4:5}

/* ===== flashcards ===== */
const C={filter:'all',deck:null,i:0,ok:0,no:0,shuf:false,flipped:false};
function buildDeck(){
  let l=CARDS.filter(c=>C.filter==='all'||(C.filter==='unknown'?!S.known[c.id]:c.t===C.filter));
  C.deck=C.shuf?shuffle(l):l; C.i=0;C.ok=0;C.no=0;C.flipped=false;
}
function renderCards(){
  if(!C.deck)buildDeck();
  const el=$('#v-cards');
  const chips=[['all','Vše',CARDS.length],...TOPICS.map(t=>[t.id,t.n,CARDS.filter(c=>c.t===t.id).length]),['unknown','Nezvládnuté',CARDS.filter(c=>!S.known[c.id]).length]];
  let body;
  if(!C.deck.length) body=`<div class="card empty">V této sadě nic není. Vyber jiný okruh.</div>`;
  else if(C.i>=C.deck.length){
    body=`<div class="card stack" style="align-items:flex-start"><div class="eyebrow">Hotovo</div><h2 class="h-sec" style="font-size:1.6rem">Prošel jsi ${C.deck.length} kartiček</h2>
     <p class="muted">Umím: <b class="mono">${C.ok}</b> · Ještě ne: <b class="mono">${C.no}</b></p>
     <div class="row"><button class="btn pri" id="cAgainUn">Projít nezvládnuté</button><button class="btn" id="cAgain">Od začátku</button></div></div>`;
  } else {
    const c=C.deck[C.i];
    body=`<div class="deck"><div class="dots"><span>${C.i+1} / ${C.deck.length}</span><span>${C.ok} umím · ${C.no} ještě ne</span></div>
     <div class="bar"><i style="transform:scaleX(${C.i/C.deck.length||0.01})"></i></div>
     <div class="stage" id="stage">
       <div class="stamp l">JEŠTĚ NE</div><div class="stamp r">UMÍM</div>
       <div class="drag" id="drag"><div class="flip${C.flipped?' on':''}" id="flip">
         <div class="face"><span class="pill topic">${TN[c.t]}</span><div class="q">${fm(c.f)}</div><div class="hint">Klepni pro odpověď · přejeď doprava, když to umíš</div></div>
         <div class="face bk"><span class="pill topic">Odpověď</span><div class="ans">${fm(c.b)}</div></div>
       </div></div>
     </div>
     <div class="deckbtns"><button class="btn bad" id="cNo">Ještě ne</button><button class="btn ok" id="cYes">Umím</button></div>
     <div class="row" style="justify-content:space-between"><button class="btn sm" id="cPrev" ${C.i?'':'disabled'}>Zpět</button><button class="btn sm" id="cFlip">Otočit</button><button class="btn sm" id="cShuf" aria-pressed="${C.shuf}">${C.shuf?'Míchání zapnuto':'Zamíchat'}</button></div></div>`;
  }
  el.innerHTML=`<div class="stack"><div class="chips" role="group" aria-label="Okruh">${chips.map(c=>`<button class="chip" aria-pressed="${C.filter===c[0]}" data-f="${c[0]}">${c[1]} <span class="mono" style="opacity:.6">${c[2]}</span></button>`).join('')}</div>${body}</div>`;
  $$('.chip',el).forEach(b=>b.onclick=()=>{C.filter=b.dataset.f;buildDeck();renderCards()});
  const g=id=>$('#'+id,el);
  if(g('cAgain'))g('cAgain').onclick=()=>{buildDeck();renderCards()};
  if(g('cAgainUn'))g('cAgainUn').onclick=()=>{C.filter='unknown';buildDeck();renderCards()};
  if(g('cYes')){g('cYes').onclick=()=>cardAnswer(true);g('cNo').onclick=()=>cardAnswer(false);
    g('cFlip').onclick=cardFlip;
    g('cPrev').onclick=()=>{if(C.i>0){C.i--;C.flipped=false;renderCards()}};
    g('cShuf').onclick=()=>{C.shuf=!C.shuf;const keep=C.filter;buildDeck();renderCards()};
    bindDrag();}
}
function cardFlip(){const f=$('#flip');if(!f)return;C.flipped=!C.flipped;f.classList.toggle('on',C.flipped)}
function cardAnswer(yes,fly){
  const c=C.deck[C.i]; if(!c)return;
  if(yes){S.known[c.id]=1;C.ok++}else{delete S.known[c.id];C.no++}
  save();C.i++;C.flipped=false;
  if(fly){setTimeout(renderCards,reduced()?0:230)}else{
    const d=$('#drag'); if(d&&!reduced()){d.classList.add('back');d.style.transform=`translateX(${yes?60:-60}px)`;d.style.opacity=0;setTimeout(renderCards,160)}else renderCards();
  }
}
function bindDrag(){
  const d=$('#drag'),st=$('#stage'); if(!d)return;
  const sl=$('.stamp.l',st),sr=$('.stamp.r',st);
  let sx=0,dx=0,vx=0,lx=0,lt=0,moved=false,on=false;
  d.addEventListener('pointerdown',e=>{if(e.button>0)return;on=true;moved=false;sx=lx=e.clientX;lt=performance.now();vx=0;dx=0;d.classList.remove('back');d.setPointerCapture(e.pointerId)});
  d.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;if(Math.abs(dx)>8)moved=true;
    const n=performance.now(),dt=n-lt||1;vx=.7*vx+.3*((e.clientX-lx)/dt);lx=e.clientX;lt=n;
    if(!moved)return;
    d.style.transform=`translateX(${dx}px) rotate(${dx/24}deg)`;
    const a=Math.min(1,Math.abs(dx)/110);sr.style.opacity=dx>0?a:0;sl.style.opacity=dx<0?a:0;});
  const end=cancel=>e=>{if(!on)return;on=false;
    if(!moved&&!cancel){cardFlip();return}
    const proj=dx+vx*180; // momentum projection, in px
    if(!cancel&&Math.abs(proj)>140){const dir=proj>0?1:-1;d.classList.add('back');
      d.style.transform=`translateX(${dir*Math.max(innerWidth,600)}px) rotate(${dir*16}deg)`;d.style.opacity=0;cardAnswer(dir>0,true)}
    else{d.classList.add('back');d.style.transform='';sr.style.opacity=sl.style.opacity=0}};
  d.addEventListener('pointerup',end(false));d.addEventListener('pointercancel',end(true));
}
document.addEventListener('keydown',e=>{
  if(tab!=='cards'||!C.deck||C.i>=C.deck.length)return;
  if(e.key===' '||e.key==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;e.preventDefault();cardFlip()}
  if(e.key==='ArrowRight')cardAnswer(true);if(e.key==='ArrowLeft')cardAnswer(false);
});

/* ===== quiz ===== */
const Z={stage:'menu',title:'',list:[],i:0,picked:null,opts:[],right:0,log:[],pendingTopic:null};
function pickSet(pool,n){ // wrong first, then unseen, then known
  const w=shuffle(pool.filter(q=>S.q[q.id]===0)),u=shuffle(pool.filter(q=>S.q[q.id]===undefined)),k=shuffle(pool.filter(q=>S.q[q.id]===1));
  return shuffle([...w,...u,...k].slice(0,n));
}
function startQuiz(title,list){Z.stage='run';Z.title=title;Z.list=list;Z.i=0;Z.right=0;Z.log=[];Z.picked=null;prepOpts();renderQuiz()}
function prepOpts(){const q=Z.list[Z.i];if(!q)return;const o=q.o.map((x,i)=>({x,ok:i===q.a}));Z.opts=q.fixed?o:shuffle(o);Z.picked=null}
function renderQuiz(){
  const el=$('#v-quiz');
  if(Z.pendingTopic){const t=Z.pendingTopic;Z.pendingTopic=null;startQuiz(TN[t],pickSet(QS.filter(q=>q.t===t),12));return}
  if(Z.stage==='menu'){
    const wrong=QS.filter(q=>S.q[q.id]===0);
    el.innerHTML=`<div class="stack rise"><div><h2 class="h-sec" style="font-size:1.5rem">Kvíz podle okruhů</h2><p class="muted">12 otázek v sadě. Nejdřív se ptá na to, co ti nešlo, pak na nové. Po každé odpovědi hned vidíš vysvětlení.</p></div>
     <div class="grid tiles">${TOPICS.map(t=>{const m=mastery(t.id);return`<button class="tile" data-set="${t.id}"><span class="nm">${t.n}</span><span class="muted" style="font-size:.82rem">${m.rn} otázek · ${m.r} správně</span><span class="bar"><i style="transform:scaleX(${Math.max(.02,m.rn?m.r/m.rn:0)})"></i></span></button>`}).join('')}
      <button class="tile" data-set="mix"><span class="nm">Mix všeho</span><span class="muted" style="font-size:.82rem">20 náhodných otázek</span><span class="pill" style="align-self:flex-start">míchaná sada</span></button>
      <button class="tile" data-set="wrong" ${wrong.length?'':'disabled style="opacity:.5"'}><span class="nm">Moje chyby</span><span class="muted" style="font-size:.82rem">${wrong.length} otázek k opakování</span><span class="pill" style="align-self:flex-start;background:var(--bad-soft);color:var(--bad)">oprava</span></button>
     </div></div>`;
    $$('.tile',el).forEach(b=>b.onclick=()=>{const s=b.dataset.set;if(b.disabled)return;
      if(s==='mix')startQuiz('Mix všeho',pickSet(QS,20));
      else if(s==='wrong')startQuiz('Moje chyby',shuffle(QS.filter(q=>S.q[q.id]===0)).slice(0,20));
      else startQuiz(TN[s],pickSet(QS.filter(q=>q.t===s),12))});
    return;
  }
  if(Z.stage==='run'){
    const q=Z.list[Z.i],done=Z.picked!==null,n=Z.list.length;
    el.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><button class="btn sm" id="zExit">Ukončit</button><span class="pill">${Z.title}</span><span class="mono muted">${Z.i+1}/${n}</span></div>
     <div class="prog">${Z.list.map((_,i)=>`<i class="${i<Z.log.length?(Z.log[i]?'ok':'no'):i===Z.i?'cur':''}"></i>`).join('')}</div>
     <div class="card qcard"><span class="pill">${TN[q.t]}</span><div class="qt">${fm(q.q)}</div>
      <div class="opts">${Z.opts.map((o,i)=>`<button class="opt${done?(o.ok?' right':Z.picked===i?' wrong':''):''}" data-i="${i}" ${done?'disabled':''}><span class="k">${L[i]}</span><span>${fm(o.x)}</span></button>`).join('')}</div>
      ${done?`<div class="expl"><b class="${Z.opts[Z.picked].ok?'g':'r'}">${Z.opts[Z.picked].ok?'Správně.':'Špatně.'}</b> ${fm(q.e)}</div>`:''}
     </div>
     ${done?`<button class="btn pri" id="zNext">${Z.i+1<n?'Další otázka':'Zobrazit výsledek'}</button>`:''}</div>`;
    $('#zExit').onclick=()=>{Z.stage='menu';renderQuiz()};
    $$('.opt',el).forEach(b=>b.onclick=()=>pickAnswer(+b.dataset.i));
    if(done)$('#zNext').onclick=nextQ;
    return;
  }
  // done
  const n=Z.list.length,pc=Z.right/n;
  const wrong=Z.list.filter((q,i)=>!Z.log[i]);
  el.innerHTML=`<div class="stack"><div class="card stack" style="align-items:flex-start"><span class="pill">${Z.title}</span>
    <div class="score">${Z.right}<span class="muted" style="font-size:1.6rem">/${n}</span></div>
    <div class="bar" style="width:100%"><i style="transform:scaleX(${Math.max(.02,pc)});background:${pc>=.75?'var(--ok)':pc>=.5?'var(--photon)':'var(--bad)'}"></i></div>
    <p class="muted">${pc===1?'Bez chyby.':pc>=.75?'Dobrá práce, projdi si zbylé chyby.':pc>=.5?'Základ máš, chyby si projdi níž a zkus znovu.':'Zkus nejdřív kartičky k tomuto okruhu a pak kvíz zopakuj.'}</p>
    <div class="row"><button class="btn pri" id="zAgain">Nová sada</button>${wrong.length?'<button class="btn" id="zFix">Opravit chyby</button>':''}<button class="btn" id="zMenu">Menu</button></div></div>
    ${wrong.length?`<div class="card"><h2 class="h-sec" style="margin-bottom:4px">K opakování</h2>${wrong.map(q=>`<div class="rev"><div class="qt">${fm(q.q)}</div><div><b class="mono" style="color:var(--ok)">Správně:</b> ${fm(q.o[q.a])}</div><div class="muted" style="margin-top:4px">${fm(q.e)}</div></div>`).join('')}</div>`:''}</div>`;
  $('#zMenu').onclick=()=>{Z.stage='menu';renderQuiz()};
  $('#zAgain').onclick=()=>{const t=TOPICS.find(t=>t.n===Z.title);startQuiz(Z.title,t?pickSet(QS.filter(q=>q.t===t.id),12):pickSet(QS,20))};
  if($('#zFix'))$('#zFix').onclick=()=>startQuiz('Moje chyby',shuffle(wrong));
}
function pickAnswer(i){
  if(Z.picked!==null)return;
  const q=Z.list[Z.i];Z.picked=i;const ok=Z.opts[i].ok;
  S.q[q.id]=ok?1:0;save();Z.log[Z.i]=ok;if(ok)Z.right++;
  renderQuiz();
  if(!ok&&!reduced()){const b=$$('.opt')[i];b&&b.classList.add('shake')}
  const ex=$('.expl');ex&&ex.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});
}
function nextQ(){Z.i++;if(Z.i>=Z.list.length){Z.stage='done'}else prepOpts();renderQuiz();window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{
  if(tab!=='quiz'||Z.stage!=='run')return;
  const n=+e.key;if(n>=1&&n<=Z.opts.length&&Z.picked===null)pickAnswer(n-1);
  else if(e.key==='Enter'&&Z.picked!==null)nextQ();
});

/* ===== test ===== */
const T={stage:'menu',def:null,qs:[],opts:[],ans:[],cur:0,end:0,timer:null,confirm:false,onlyWrong:false,res:null};
const TESTS=[
 {id:'A',n:'Vzorový test z fotky',d:'Všech 24 otázek ze skenu, ve stejném pořadí. Je to nejlepší odhad, jak bude test vypadat.',min:30,make:()=>SCAN.map(id=>QS.find(q=>q.id===id))},
 {id:'B',n:'Jádro a radioaktivita',d:'20 nových otázek: nuklidy, záření, přeměny a poločas rozpadu.',min:25,make:()=>spread(['nuklidy','zareni','premeny','polocas','stavba'],20)},
 {id:'C',n:'Elektronový obal',d:'20 otázek: modely, kvantová čísla, orbitaly a konfigurace.',min:25,make:()=>spread(['modely','kvantova','konfig'],20)}
];
function spread(topics,n){ // round-robin across topics, excluding scan items so they stay fresh
  const pools=topics.map(t=>shuffle(QS.filter(q=>q.t===t&&!q.scan)));const out=[];
  while(out.length<n&&pools.some(p=>p.length))for(const p of pools){if(p.length&&out.length<n)out.push(p.pop())}
  return shuffle(out);
}
function fmtT(s){s=Math.max(0,s);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTest(def){
  T.def=def;T.qs=def.make();T.opts=T.qs.map(q=>{const o=q.o.map((x,i)=>({x,ok:i===q.a}));return q.fixed?o:shuffle(o)});
  T.ans=T.qs.map(()=>null);T.cur=0;T.confirm=false;T.stage='run';T.end=Date.now()+def.min*60000;
  clearInterval(T.timer);T.timer=setInterval(tick,1000);renderTest();window.scrollTo(0,0);
}
function tick(){
  if(tab!=='test'||T.stage!=='run')return;
  const left=Math.round((T.end-Date.now())/1000),t=$('#tTimer');
  if(t){t.textContent=fmtT(left);t.classList.toggle('low',left<=300)}
  if(left<=0)finishTest();
}
function finishTest(){
  clearInterval(T.timer);
  let pts=0;const total=T.qs.length;
  T.qs.forEach((q,i)=>{const ok=T.ans[i]!==null&&T.opts[i][T.ans[i]].ok;if(ok)pts++;S.q[q.id]=ok?1:0});
  const pct=pts/total;T.res={pts,total,pct,grade:grade(pct)};
  S.tests.push({n:T.def.n,pts,total,pct,grade:T.res.grade,ts:Date.now()});S.tests=S.tests.slice(-20);save();
  T.stage='done';T.onlyWrong=false;renderTest();window.scrollTo(0,0);
}
function renderTest(){
  const el=$('#v-test');
  if(T.stage==='menu'){
    const hist=S.tests.slice(-3).reverse();
    el.innerHTML=`<div class="stack rise"><div><h2 class="h-sec" style="font-size:1.5rem">Zkušební test</h2><p class="muted">Bez nápovědy, s časovým limitem. Výsledek a vysvětlení uvidíš až po odevzdání. Známka se počítá jako ve škole: 90 % jednička, 75 % dvojka, 60 % trojka, 45 % čtyřka.</p></div>
     <div class="grid tiles">${TESTS.map(t=>`<button class="tile" data-t="${t.id}"><span class="pill" style="align-self:flex-start">${t.min} min</span><span class="nm">${t.n}</span><span class="muted" style="font-size:.86rem">${t.d}</span></button>`).join('')}</div>
     ${hist.length?`<div class="card"><h2 class="h-sec" style="margin-bottom:4px">Poslední pokusy</h2>${hist.map(h=>`<div class="mrow" style="grid-template-columns:1fr auto auto"><span class="nm">${h.n}</span><span class="mono muted">${h.pts}/${h.total}</span><span class="pill">známka ${h.grade}</span></div>`).join('')}</div>`:''}</div>`;
    $$('.tile',el).forEach(b=>b.onclick=()=>startTest(TESTS.find(t=>t.id===b.dataset.t)));
    return;
  }
  if(T.stage==='run'){
    const q=T.qs[T.cur],n=T.qs.length,left=Math.round((T.end-Date.now())/1000),un=T.ans.filter(a=>a===null).length;
    el.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><span class="pill">${T.def.n}</span><span class="timer${left<=300?' low':''}" id="tTimer">${fmtT(left)}</span></div>
     <div class="nav-q">${T.qs.map((_,i)=>`<button class="${T.ans[i]!==null?'a':''} ${i===T.cur?'c':''}" data-n="${i}" aria-label="Otázka ${i+1}">${i+1}</button>`).join('')}</div>
     <div class="card qcard"><span class="eyebrow">Otázka ${T.cur+1} z ${n}</span><div class="qt">${fm(q.q)}</div>
      <div class="opts">${T.opts[T.cur].map((o,i)=>`<button class="opt${T.ans[T.cur]===i?' sel':''}" data-i="${i}"><span class="k">${L[i]}</span><span>${fm(o.x)}</span></button>`).join('')}</div></div>
     <div class="row" style="justify-content:space-between"><button class="btn" id="tPrev" ${T.cur?'':'disabled'}>Zpět</button>
      <button class="btn ${T.confirm?'bad':''}" id="tEnd">${T.confirm?`Opravdu odevzdat? ${un?`Bez odpovědi: ${un}`:''}`:'Odevzdat test'}</button>
      <button class="btn pri" id="tNext" ${T.cur<n-1?'':'disabled'}>Další</button></div></div>`;
    $$('.nav-q button',el).forEach(b=>b.onclick=()=>{T.cur=+b.dataset.n;T.confirm=false;renderTest()});
    $$('.opt',el).forEach(b=>b.onclick=()=>{T.ans[T.cur]=+b.dataset.i;T.confirm=false;renderTest()});
    $('#tPrev').onclick=()=>{T.cur--;T.confirm=false;renderTest()};
    $('#tNext').onclick=()=>{T.cur++;T.confirm=false;renderTest();window.scrollTo(0,0)};
    $('#tEnd').onclick=()=>{if(T.confirm)finishTest();else{T.confirm=true;renderTest()}};
    return;
  }
  const r=T.res,col=r.grade<=2?'var(--ok)':r.grade===3?'var(--photon)':'var(--bad)';
  const items=T.qs.map((q,i)=>({q,i,ok:T.ans[i]!==null&&T.opts[i][T.ans[i]].ok})).filter(x=>!T.onlyWrong||!x.ok);
  el.innerHTML=`<div class="stack"><div class="card stack" style="align-items:flex-start"><span class="pill">${T.def.n}</span>
    <div class="row" style="gap:22px;align-items:flex-end"><div><div class="eyebrow">Známka</div><div class="score" style="color:${col}">${r.grade}</div></div><div><div class="eyebrow">Body</div><div class="score" style="font-size:2.2rem">${r.pts}<span class="muted" style="font-size:1.2rem">/${r.total}</span></div></div><div class="mono muted">${Math.round(r.pct*100)} %</div></div>
    <div class="row"><button class="btn pri" id="tAgain">Další test</button><button class="btn" id="tToggle" aria-pressed="${T.onlyWrong}">${T.onlyWrong?'Zobrazit všechny':'Jen chyby'}</button></div></div>
    <div class="card"><h2 class="h-sec" style="margin-bottom:2px">Rozbor</h2>${items.length?items.map(x=>`<div class="rev"><div class="row" style="justify-content:space-between"><b class="mono">${x.i+1}.</b><span class="pill" style="${x.ok?'background:var(--ok-soft);color:var(--ok)':'background:var(--bad-soft);color:var(--bad)'}">${x.ok?'správně':T.ans[x.i]===null?'bez odpovědi':'špatně'}</span></div>
      <div class="qt">${fm(x.q.q)}</div>${x.ok?'':`<div class="muted">Tvoje odpověď: ${T.ans[x.i]===null?'–':fm(T.opts[x.i][T.ans[x.i]].x)}</div>`}
      <div><b class="mono" style="color:var(--ok)">Správně:</b> ${fm(x.q.o[x.q.a])}</div><div class="muted" style="margin-top:4px">${fm(x.q.e)}</div></div>`).join(''):'<div class="empty">Žádné chyby.</div>'}</div></div>`;
  $('#tAgain').onclick=()=>{T.stage='menu';renderTest()};
  $('#tToggle').onclick=()=>{T.onlyWrong=!T.onlyWrong;renderTest()};
}

/* ===== boot ===== */
Models.init($('#v-lab'));
renderHome();


</script>
